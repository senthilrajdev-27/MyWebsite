<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Paws Park 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="intro">
<div id="sky"><i id="sun"></i><i class="cloud" style="top:12%;animation-delay:-10s"></i><i class="cloud" style="top:26%;animation-delay:-35s;scale:.7"></i></div>

<div id="world">
  <div id="fence"></div>
  <span class="deco" style="left:4%;font-size:64px">🌳</span>
  <span class="deco" style="left:44%;font-size:48px">🌷</span>
  <span class="deco" style="right:30%;font-size:60px">🌳</span>
  <div id="ground"></div>
  <div class="sign">🐾 HAPPY Nans 🤭 PAWS PARK</div>
  <div id="field"><div class="cage"><i class="bars"></i></div></div>
</div>

<section id="panel" aria-live="polite">
  <h1 id="t"></h1><p id="p"></p><div id="x"></div><div id="b"></div>
</section>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="modal" role="dialog" aria-modal="true"></div>

  <button id="mp" aria-label="Play or pause music">🎵</button>
  <div id="chips"></div>
</div>-->

  <div id="ytbox">
    <div id="yt"></div>
  </div>
  <button id="mp" aria-label="Play or pause music">🎵</button>
  <div id="chips"></div>
</div>



<script src="script.js"></script>

</html>
